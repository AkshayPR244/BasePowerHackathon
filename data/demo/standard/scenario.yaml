name: standard synthetic two-visit recovery benchmark
description: 45 synthetic homes, each needing an install then a battery day. 3 clusters,
  2 install crews, 1 battery crew(s), 10 business days. Every number comes from a
  stated rule or source.
timezone: America/Chicago
planning_start: 2018-06-04
planning_end: 2018-06-15
evaluation_end: 2018-07-29
qualification_lag_days: 0
unscheduled_penalty_days: 30
objective_policy: value_aware
solve_time_limit_s: 15
random_seed: 42
num_workers: 8
synthetic: true
min_gap_business_days: 1
travel_allowance_min:
  N: 34
  S: 41
  W: 33
batteries:
- configuration_id: B13
  capacity_kwh: 13.5
  reserve_kwh: 1.35
  charge_limit_kw: 5.0
  discharge_limit_kw: 11.5
  eta_charge: 0.943398
  eta_discharge: 0.943398
weather_rule:
  thunder: true
  heavy_rain_mm_per_h: 7.6
  work_start_hour: 8
  work_end_hour: 17
parameters:
- name: workday
  value: 480
  unit: min
  kind: assumed
  derivation: One 8-hour crew day
- name: install_duration
  value: 90/120/150/180
  unit: min
  kind: assumed
  derivation: Electrical disconnect visit of 1.5 to 3 hours, varied per home (seeded)
- name: battery_day_duration
  value: 60/75/90
  unit: min
  kind: assumed
  derivation: About 75 min to place one battery, so a battery crew fits 5 to 6 a day
    with travel
- name: min_gap_install_to_battery_day
  value: 1
  unit: business days
  kind: assumed
  derivation: The battery day comes at least one business day after the install
- name: crew_mix
  value: '2:1'
  unit: install:battery crews
  kind: assumed
  derivation: Installs take longer per home, so two install crews feed one battery
    crew
- name: battery_crew_start
  value: 1
  unit: business days
  kind: assumed
  derivation: Battery crews start after the first window day because no install is
    finished yet
- name: ready_dates
  value: 5
  unit: business days
  kind: synthetic
  derivation: Each home becomes ready on a uniform random day in the first N business
    days
- name: deadline_rule
  value: 6
  unit: business days
  kind: assumed
  derivation: Battery-day deadline = ready date + N business days, capped at the last
    window day
- name: business_days
  value: weekdays
  unit: ''
  kind: assumed
  derivation: Crews work weekdays that are not US federal holidays
- name: overflow_days
  value: 0
  unit: business days
  kind: assumed
  derivation: Crew days after the window where late visits can still land
- name: current_plan_rule
  value: EDF
  unit: ''
  kind: derived
  derivation: Current plan = this tool's strict plan for the undisrupted scenario,
    day 0 locked. Deliveries are sized to it
- name: depot
  value: -95.4200,29.7467
  unit: lon,lat
  kind: assumed
  derivation: Crew yard at the mean of the cluster centers
- name: road_circuity
  value: 1.417
  unit: ratio
  kind: assumed
  derivation: US nationwide driving distance / straight-line distance
  source: Boscoe, Henry, Zdeb (2012). A Nationwide Comparison of Driving Distance
    Versus Straight-Line Distance to Hospitals. The Professional Geographer 64(2):188-196.
- name: average_speed
  value: 40.0
  unit: km/h
  kind: assumed
  derivation: Urban driving including stops
- name: travel_N
  value: 34
  unit: min
  kind: derived
  derivation: (2 x depot-to-center + 2 x mean site radius) x circuity / speed, depot
    distance 7.30 km
- name: travel_S
  value: 41
  unit: min
  kind: derived
  derivation: (2 x depot-to-center + 2 x mean site radius) x circuity / speed, depot
    distance 8.85 km
- name: travel_W
  value: 33
  unit: min
  kind: derived
  derivation: (2 x depot-to-center + 2 x mean site radius) x circuity / speed, depot
    distance 6.77 km
- name: deliveries
  value: 3
  unit: business days
  kind: assumed
  derivation: A delivery every N business days, sized to the planned battery days
    until the next
- name: battery_capacity
  value: 13.5
  unit: kWh
  kind: observed
  derivation: Powerwall 3 nominal battery energy (13.5 kWh AC)
  source: https://energylibrary.tesla.com/docs/Public/EnergyStorage/Powerwall/3/Datasheet/en-us/Powerwall-3-Datasheet.pdf
- name: battery_charge_limit
  value: 5.0
  unit: kW
  kind: observed
  derivation: Powerwall 3 maximum continuous charge power
  source: https://energylibrary.tesla.com/docs/Public/EnergyStorage/Powerwall/3/Datasheet/en-us/Powerwall-3-Datasheet.pdf
- name: battery_discharge_limit
  value: 11.5
  unit: kW
  kind: observed
  derivation: Powerwall 3 nominal output power, highest rating
  source: https://energylibrary.tesla.com/docs/Public/EnergyStorage/Powerwall/3/Datasheet/en-us/Powerwall-3-Datasheet.pdf
- name: battery_round_trip
  value: 0.89
  unit: fraction
  kind: observed
  derivation: Powerwall 3 solar-to-battery-to-home/grid efficiency (typical solar
    shifting). The datasheet gives no grid-charge figure
  source: https://energylibrary.tesla.com/docs/Public/EnergyStorage/Powerwall/3/Datasheet/en-us/Powerwall-3-Datasheet.pdf
- name: battery_one_way_efficiency
  value: 0.943398
  unit: fraction
  kind: derived
  derivation: Charge and discharge efficiency = sqrt(round trip)
- name: battery_reserve
  value: 1.35
  unit: kWh
  kind: assumed
  derivation: 10% of capacity held back; start and end at reserve
- name: value_start
  value: after battery day
  unit: ''
  kind: assumed
  derivation: Energy value starts after the battery day; the install alone earns nothing
- name: unscheduled_penalty
  value: 30
  unit: days
  kind: assumed
  derivation: Delay charged for a home left unscheduled; larger than any lateness
    in the horizon
- name: weather_thunder
  value: any TS in METAR
  unit: ''
  kind: assumed
  derivation: Electrical work stops for lightning. A thunderstorm report in working
    hours loses the crew-day
- name: weather_battery_day
  value: same rule
  unit: ''
  kind: assumed
  derivation: Battery days stop for the same weather as installs; their sensitivity
    is untested
- name: weather_heavy_rain
  value: 7.6
  unit: mm/h
  kind: assumed
  derivation: AMS heavy-rain threshold (0.30 in/h) in any working hour loses the crew-day
  source: https://glossary.ametsoc.org/wiki/Rain
- name: weather_working_hours
  value: 08-17
  unit: local hour
  kind: assumed
  derivation: Hours in which weather can stop work
- name: weather_station
  value: HOU
  unit: ''
  kind: assumed
  derivation: Nearest ASOS station to the study area (Houston Hobby)
provenance:
- input: all operational and geometry files
  kind: synthetic
  source: Rule-based generator v3, seed 42. Not customers.
- input: prices.parquet
  kind: observed
  source: https://www.ercot.com/misdownload/servlets/mirDownload?doclookupId=642564849
  manifest_id: ercot_np6_785_2018
- input: loads.parquet
  kind: modeled
  source: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2025/resstock_amy2018_release_1/timeseries_individual_buildings/by_state/upgrade=0/state=TX/100-0.parquet
  manifest_id: resstock_amy2018_tx_100
- input: sites.csv:profile_id
  kind: modeled
  source: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2025/resstock_amy2018_release_1/timeseries_individual_buildings/by_state/upgrade=0/state=TX/100-0.parquet
  manifest_id: resstock_amy2018_tx_100
