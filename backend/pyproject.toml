[project]
name = "rollout-planner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "ortools>=9.11",
    "scipy>=1.14",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
